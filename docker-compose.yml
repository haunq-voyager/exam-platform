# Environment shared by the API container and the scheduler (both run the same image).
x-backend-env: &backend-env
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ai_online_exam
  DB_USERNAME: ai_online_exam
  DB_PASSWORD: secret
  APP_URL: http://localhost:8010
  APP_NAME: ExamHub
  APP_LOCALE: vi
  # Public address of the web app: the links inside emails point here.
  FRONTEND_URL: http://localhost:3000
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
  # Development mail goes to Mailpit (http://localhost:8025). Point these at a real SMTP server in production.
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: no-reply@examhub.local
  MAIL_FROM_NAME: ExamHub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_online_exam
      POSTGRES_USER: ai_online_exam
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_online_exam"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-online-exam-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env
    volumes:
      # Uploaded files (avatars) must survive rebuilding/recreating the container.
      - backend_uploads:/app/storage/app/public
    ports:
      - "8010:8000"

  # Runs the Laravel scheduler: reminder emails and notifications every 5 minutes, expired attempts every minute.
  scheduler:
    image: ai-online-exam-backend:latest
    depends_on:
      - backend
    environment: *backend-env
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  # Catches every email the app sends in development; read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010/api
    image: ai-online-exam-web:latest
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
  backend_uploads:
